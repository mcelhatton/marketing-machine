.df-header{left:0;padding:1rem 1.5rem;position:fixed;right:0;top:0;z-index:1000}.df-header__inner{margin:0 auto;max-width:1280px}.df-header__card{align-items:center;background:#1A1E24;border:1px solid #2D3239;border-radius:9999px;box-shadow:0 4px 20px rgba(0,0,0,.35);display:flex;justify-content:space-between;padding:.6rem .6rem .6rem 1.5rem}.df-header__logo{align-items:center;display:flex;flex-shrink:0}.df-header__logo img{height:40px;width:auto}.df-header__nav{align-items:center;display:flex;gap:.375rem}.df-header__nav-item{position:relative}.df-header__nav-link{align-items:center;background:none;border:none;border-radius:9999px;color:#fff;cursor:pointer;display:inline-flex;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:.95rem;font-weight:600;gap:.3rem;padding:.6rem .9rem;text-decoration:none;transition:all .2s ease;white-space:nowrap}.df-header__nav-link:hover{background-color:rgba(255,255,255,.06);color:#8ac833}.df-header__nav-link svg{height:14px;transition:transform .2s ease;width:14px}.df-header__nav-item:hover .df-header__nav-link svg{transform:rotate(180deg)}.df-header__dropdown{background:#22272E;border:1px solid #2D3239;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);left:50%;margin-top:.5rem;min-width:220px;opacity:0;padding:.5rem;position:absolute;top:100%;transform:translateX(-50%);transition:all .25s ease;visibility:hidden}.df-header__nav-item:hover .df-header__dropdown{opacity:1;transform:translateX(-50%) translateY(0);visibility:visible}.df-header__dropdown-link{border-radius:8px;color:#F5F6F4;display:block;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:.95rem;font-weight:500;padding:.65rem .95rem;text-decoration:none;transition:all .15s ease}.df-header__dropdown-link:hover{background-color:rgba(138,200,51,.12);color:#8ac833}.df-header__actions{align-items:center;display:flex;gap:.75rem}.df-header__login{border-radius:9999px;color:#fff;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:.95rem;font-weight:600;padding:.6rem 1rem;text-decoration:none;transition:all .2s ease}.df-header__login:hover{background-color:rgba(255,255,255,.06);color:#8ac833}.df-header__cta{align-items:center;background:linear-gradient(135deg,#8ac833,#5e970f);border-radius:9999px;box-shadow:0 2px 8px rgba(138,200,51,.25);color:#1A1E24;display:inline-flex;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:.95rem;font-weight:700;gap:.3rem;padding:.7rem 1.35rem;text-decoration:none;transition:all .3s ease}.df-header__cta:hover{background:linear-gradient(135deg,#8ac833,#5e970f);box-shadow:0 6px 20px rgba(138,200,51,.4);color:#1A1E24;transform:translateY(-2px)}.df-header__cta svg{height:14px;width:14px}.df-header__mobile-toggle{align-items:center;background:rgba(255,255,255,.08);border:none;border-radius:50%;cursor:pointer;display:none;height:44px;justify-content:center;transition:all .2s ease;width:44px}.df-header__mobile-toggle:hover{background:rgba(255,255,255,.15)}.df-header__mobile-toggle svg{color:#fff;height:20px;width:20px}.df-header__phone{align-items:center;color:#fff;cursor:pointer;display:inline-flex;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:.95rem;font-weight:600;gap:.35rem;border-radius:9999px;padding:.6rem .75rem;text-decoration:none;transition:all .2s ease;white-space:nowrap}.df-header__phone:hover{background-color:rgba(255,255,255,.06);color:#8ac833}.df-header__phone svg{height:14px;width:14px}@media (max-width:1100px){.df-header{padding:.25rem}.df-header__card{border-radius:14px;padding:.25rem .25rem .25rem .625rem}.df-header__nav{background:#1A1E24;border-radius:0;bottom:0;box-shadow:none;box-sizing:border-box;display:none;flex-direction:column;gap:.25rem;left:0;overflow-x:hidden;overflow-y:auto;padding:4rem .75rem 1.5rem;position:fixed;right:0;top:0;z-index:999}.df-header__nav.active{display:flex}.df-header__nav-item{width:100%}.df-header__nav-link{background:#22272E;border-radius:10px;font-size:.9375rem;justify-content:space-between;min-height:48px;padding:.875rem .75rem;width:100%}.df-header__dropdown{background:#161A1F;border:1px solid #2D3239;border-radius:10px;box-shadow:none;margin-top:.375rem;max-height:0;min-width:100%;opacity:1;overflow:hidden;padding:0;position:static;transform:none;visibility:visible;width:100%}.df-header__nav-item:hover .df-header__dropdown{transform:none}.df-header__nav-item.active .df-header__dropdown{max-height:600px;padding:.375rem}.df-header__dropdown-link{align-items:center;box-sizing:border-box;display:flex;font-size:.875rem;min-height:44px;padding:.75rem 1rem;text-align:left;white-space:normal;width:100%;word-wrap:break-word}.df-header__nav-item.active .df-header__nav-link svg{transform:rotate(180deg)}.df-header__login{display:none}.df-header__phone{display:none}.df-header__mobile-toggle{display:flex;height:36px;width:36px;z-index:1001}.df-header__mobile-toggle svg{height:18px;width:18px}.df-header__cta{font-size:.6875rem;padding:.5rem .75rem}.df-header__card{position:relative;z-index:1000}}@media (max-width:640px){.df-header{padding:.1875rem}.df-header__card{border-radius:12px;padding:.1875rem .1875rem .1875rem .5rem}.df-header__cta{font-size:.625rem;padding:.375rem .5rem}.df-header__cta svg{display:none}.df-header__logo img{height:22px}.df-header__mobile-toggle{height:32px;width:32px}.df-header__mobile-toggle svg{height:16px;width:16px}.df-header__nav{padding:3.5rem .5rem 1rem}.df-header__nav-link{border-radius:8px;font-size:.875rem;min-height:44px;padding:.75rem .625rem}.df-header__dropdown{border-radius:8px;margin-top:.25rem}.df-header__nav-item.active .df-header__dropdown{padding:.25rem}.df-header__dropdown-link{box-sizing:border-box;font-size:.8125rem;min-height:40px;padding:.625rem .875rem;width:100%}}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var toggle = document.getElementById("mobileMenuToggle");
  var nav = document.getElementById("headerNav");
  var dropdownItems = document.querySelectorAll(".df-header__nav-item");

  if (toggle) {
    toggle.addEventListener("click", function () { nav.classList.toggle("active"); });
  }

  dropdownItems.forEach(function (item) {
    var link = item.querySelector(".df-header__nav-link");
    var hasDropdown = item.querySelector(".df-header__dropdown");
    if (link && hasDropdown) {
      link.addEventListener("click", function (e) {
        if (window.innerWidth <= 1100) {
          e.preventDefault();
          dropdownItems.forEach(function (other) { if (other !== item) other.classList.remove("active"); });
          item.classList.toggle("active");
        }
      });
    }
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".df-header")) {
      nav.classList.remove("active");
      dropdownItems.forEach(function (item) { item.classList.remove("active"); });
    }
  });

  window.addEventListener("resize", function () {
    if (window.innerWidth > 1100) {
      nav.classList.remove("active");
      dropdownItems.forEach(function (item) { item.classList.remove("active"); });
    }
  });
});
</script>
