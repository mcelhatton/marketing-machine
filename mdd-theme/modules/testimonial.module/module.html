{# Testimonial — editorial pull quote, no card, no quote-mark graphic. #}
<section class="section bg-{{ module.background }}">
  <div class="container home-quote">
    <blockquote>{{ module.quote }}</blockquote>
    <div class="who">
      <b>{{ module.author }}</b>{% if module.role %} — {{ module.role }}{% endif %}{% if module.company %}, {{ module.company }}{% endif %}
    </div>
  </div>
</section>
